<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tidal stream player</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background:#111; color:#ddd; margin:0; padding:2rem; }
  h1 { font-size:1.1rem; }
  button { font: inherit; padding:.5rem 1rem; background:#2b6; color:#011; border:0; border-radius:4px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  table { border-collapse:collapse; margin-top:1rem; }
  td { padding:.15rem .8rem .15rem 0; }
  td.k { color:#888; }
  #log { margin-top:1rem; color:#888; white-space:pre-wrap; }
  .warn { color:#e94; }
</style>
</head>
<body>
<h1>tidal stream player</h1>
<p>Low-latency playout with an adaptive fill controller. Click start to
unlock audio, then connect.</p>
<p><button id="start" disabled>start audio</button>
   <button id="connect">connect</button>
   <span id="state">idle</span></p>
<p><label>latency profile
   <select id="profile">
     <option value="30">low — 30 ms</option>
     <option value="60" selected>normal — 60 ms</option>
     <option value="120">stable — 120 ms</option>
   </select></label>
   <span id="pmode"></span></p>
<table>
  <tr><td class="k">seq</td><td id="seq">-</td></tr>
  <tr><td class="k">fill</td><td id="fill">-</td></tr>
  <tr><td class="k">jitter est</td><td id="jitter">-</td></tr>
  <tr><td class="k">target Ft</td><td id="ft">-</td></tr>
  <tr><td class="k">dropped audio</td><td id="dropped">0 ms</td></tr>
  <tr><td class="k">underruns</td><td id="underruns">0</td></tr>
  <tr><td class="k">discontinuities</td><td id="disc">0</td></tr>
</table>
<div id="log"></div>

<!-- AudioWorklet source kept as text so the single-file page can build it
     into a Blob URL without escaping. -->
<script type="text/plain" id="processor-src">
class StreamPlayer extends AudioWorkletProcessor {
  constructor(options) {
    super();
    this.rate = sampleRate;
    this.frameMs = (options.processorOptions && options.processorOptions.frameMs) || 20;
    // Client-side target floor: the dominant latency term. The server advertises
    // its default in /status; the page's profile control can change it live.
    this.fillFloorMs = (options.processorOptions && options.processorOptions.fillFloorMs) || 60;
    this.capFrames = Math.ceil(this.rate * 0.5); // 500 ms capacity
    this.buf = new Float32Array(this.capFrames * 2);
    this.writePos = 0;
    this.readPos = 0;
    this.repriming = true;
    this.jitterEst = -1;
    this.alpha = 0.05;
    this.dropped = 0;
    this.lastConvergeDrop = 0;   // last slow-convergence drop (ms, currentTime)
    this.convergeIntervalMs = 400;
    this.underruns = 0;
    this.disc = 0;
    this.seq = 0;
    this.lastArrival = 0;
    this.lastStats = currentTime;
    this.port.onmessage = (e) => this.onFrame(e.data);
  }
  ft() { return Math.min(250, Math.max(this.fillFloorMs, 3 * this.jitterEst)); }
  onFrame(m) {
    const now = currentTime * 1000;
    if (m.type === 'ctrl') { this.seq = m.seq; return; }
    if (m.type === 'setFloor') {
      const next = Math.max(10, Math.min(250, m.fillFloorMs));
      const raised = next > this.fillFloorMs;
      this.fillFloorMs = next;
      // Raising the target must actually ADD buffering: the buffer only grows by
      // repriming, so without this the control would claim 120 ms of safety
      // while fill stayed wherever it was, and the next stall would underrun
      // anyway. Lowering it does not need a re-prime (the drop rules shed).
      const fillMs = ((this.writePos - this.readPos) / this.rate) * 1000;
      if (raised && fillMs < next) this.repriming = true;
      return;
    }
    if (this.lastArrival > 0) {
      const dev = Math.abs((now - this.lastArrival) - this.frameMs);
      this.jitterEst = this.jitterEst < 0 ? dev : (this.alpha * dev + (1 - this.alpha) * this.jitterEst);
    }
    this.lastArrival = now;
    if (this.jitterEst < 0) this.jitterEst = 0;
    if (m.flags & 1) { // discontinuity: hard resync
      this.disc++;
      this.readPos = this.writePos;
      this.repriming = true;
    }
    const frames = m.frames;
    const nFrames = frames.length / 2;
    for (let i = 0; i < nFrames; i++) {
      const slot = ((this.writePos + i) % this.capFrames) * 2;
      this.buf[slot] = frames[i * 2] / 32768;
      this.buf[slot + 1] = frames[i * 2 + 1] / 32768;
    }
    this.writePos += nFrames;
    if (this.writePos - this.readPos > this.capFrames) {
      this.readPos = this.writePos - this.capFrames;
    }
    this.seq = m.seq;
  }
  process(inputs, outputs) {
    const out = outputs[0];
    const L = out[0];
    const R = out[1] || out[0];
    const n = L.length;
    const ftFrames = Math.round((this.ft() / 1000) * this.rate);
    const fmaxFrames = Math.round(((this.ft() + 80) / 1000) * this.rate);
    let fill = this.writePos - this.readPos;
    if (fill > fmaxFrames) { // overfill: drop oldest to Ft
      const drop = fill - ftFrames;
      this.readPos += drop;
      this.dropped += drop;
      fill = this.writePos - this.readPos;
    }
    // Slow convergence back to the target. The Fmax rule above only corrects
    // large overfills, so without this a one-off disturbance (a capture restart,
    // a network hiccup) leaves the playout sitting anywhere in (Ft, Fmax] for
    // good - fill cannot fall on its own, since consumption only matches
    // production. Correct frame-aligned and rate-limited: at most one 20 ms
    // frame per convergeIntervalMs, and only while more than one frame above
    // target. Frame-aligned drops match the server's own granularity and are the
    // least audible way to shed latency.
    const nowMs = currentTime * 1000;
    const oneFrame = Math.round((this.frameMs / 1000) * this.rate);
    if (
      !this.repriming &&
      fill > ftFrames + oneFrame &&
      nowMs - this.lastConvergeDrop > this.convergeIntervalMs
    ) {
      this.readPos += oneFrame;
      this.dropped += oneFrame;
      this.lastConvergeDrop = nowMs;
      fill = this.writePos - this.readPos;
    }
    if (this.repriming) {
      if (fill >= ftFrames) {
        this.readPos = this.writePos - ftFrames;
        this.repriming = false;
        fill = ftFrames;
      } else {
        L.fill(0); R.fill(0);
        this.report();
        return true;
      }
    }
    if (fill < n) { // underfill: silence-pad + refill to Ft
      this.underruns++;
      L.fill(0); R.fill(0);
      this.readPos = this.writePos;
      this.repriming = true;
      this.report();
      return true;
    }
    for (let i = 0; i < n; i++) {
      const slot = ((this.readPos + i) % this.capFrames) * 2;
      L[i] = this.buf[slot];
      R[i] = this.buf[slot + 1];
    }
    this.readPos += n;
    this.report();
    return true;
  }
  report() {
    if (currentTime * 1000 - this.lastStats < 200) return;
    this.lastStats = currentTime * 1000;
    this.port.postMessage({
      type: 'stats',
      seq: this.seq,
      fillMs: ((this.writePos - this.readPos) / this.rate) * 1000,
      jitterMs: this.jitterEst,
      ft: this.ft(),
      // `this.dropped` is counted in sample frames — the ring buffer's natural
      // unit — but reporting it raw made the UI claim "dropped frames" while the
      // daemon's `dropped` counts 20 ms frames. Report milliseconds so the two
      // cannot be confused: a reconnect catch-up of a few hundred ms shows up as
      // a 3-4 digit number, which is audio time, not lost packets.
      droppedMs: (this.dropped / this.rate) * 1000,
      underruns: this.underruns,
      disc: this.disc,
      repriming: this.repriming,
    });
  }
}
registerProcessor('stream-player', StreamPlayer);
</script>

<script>
// Frame geometry comes from the SERVER (/status): frameMs is configurable, so
// hardcoding 20 ms here would silently desync the client the moment the stream
// is tuned for latency. fillFloorMs is the client-side target floor — the
// dominant latency term — and the profile control can change it live.
let FRAME_MS = 20;
let FILL_FLOOR_MS = 60;
let CHANNELS = 2;
let FRAME_BYTES = 3840;        // rate/1000 * frameMs * channels * 2 (s16)
let MSG_BYTES = 13 + FRAME_BYTES;
let RATE = 48000;

function recomputeGeometry() {
  FRAME_BYTES = Math.round((RATE * FRAME_MS) / 1000) * CHANNELS * 2;
  MSG_BYTES = 13 + FRAME_BYTES;
  if (el('pmode')) {
    el('pmode').textContent = `${RATE} Hz · ${FRAME_MS} ms frames · floor ${FILL_FLOOR_MS} ms`;
  }
}

function syncProfileControl() {
  const sel = el('profile');
  if (!sel) return;
  const v = String(FILL_FLOOR_MS);
  if ([...sel.options].some((o) => o.value === v)) {
    sel.value = v;
    return;
  }
  // The server's floor is not one of the presets: show what is actually in
  // force rather than leaving the control displaying a value that is not true.
  const o = document.createElement('option');
  o.value = v;
  o.textContent = `server — ${v} ms`;
  sel.appendChild(o);
  sel.value = v;
}

function applyGeometry(s) {
  FRAME_MS = Number(s.frameMs) || FRAME_MS;
  RATE = Number(s.rate) || RATE;
  CHANNELS = Number(s.channels) || CHANNELS;
  if (Number.isFinite(Number(s.fillFloorMs))) FILL_FLOOR_MS = Number(s.fillFloorMs);
  recomputeGeometry();
  syncProfileControl();
}

async function loadProfile() {
  try {
    const r = await fetch('/status' + (token ? `?token=${encodeURIComponent(token)}` : ''), { cache: 'no-store' });
    if (r.ok) applyGeometry(await r.json());
  } catch (e) {
    log('profile fetch failed, using defaults: ' + e.message);
  }
}

const el = (id) => document.getElementById(id);
const logEl = el('log');
function log(msg) { logEl.textContent += msg + '\n'; }

let ctx = null;
let node = null;
let ws = null;
let wsClosedByUser = false;

const params = new URLSearchParams(window.location.search);
const token = params.get('token') || '';
const wsUrl = () => {
  const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const host = window.location.host || '127.0.0.1:8787';
  return `${proto}//${host}/` + (token ? `?token=${encodeURIComponent(token)}` : '');
};

async function startAudio() {
  ctx = new AudioContext({ latencyHint: 'interactive', sampleRate: RATE });
  const src = el('processor-src').textContent;
  const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
  await ctx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  node = new AudioWorkletNode(ctx, 'stream-player', {
    numberOfInputs: 0,
    numberOfOutputs: 1,
    outputChannelCount: [2],
    processorOptions: { frameMs: FRAME_MS, fillFloorMs: FILL_FLOOR_MS },
  });
  node.port.onmessage = (e) => {
    const s = e.data;
    if (s.type !== 'stats') return;
    el('seq').textContent = s.seq;
    el('fill').textContent = s.fillMs.toFixed(1) + ' ms' + (s.repriming ? ' (priming)' : '');
    el('jitter').textContent = s.jitterMs.toFixed(1) + ' ms';
    el('ft').textContent = s.ft.toFixed(0) + ' ms';
    el('dropped').textContent = s.droppedMs.toFixed(0) + ' ms';
    el('underruns').textContent = s.underruns;
    el('disc').textContent = s.disc;
  };
  node.connect(ctx.destination);
  await ctx.resume();
  el('start').disabled = true;
  el('connect').disabled = false;
  el('state').textContent = 'audio ready (' + ctx.sampleRate + ' Hz)';
  log('AudioContext latencyHint=interactive, sampleRate=' + ctx.sampleRate);
}

function connect() {
  if (!node) { log('start audio first'); return; }
  wsClosedByUser = false;
  const url = wsUrl();
  log('connecting ' + url);
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { el('state').textContent = 'connected'; log('ws open'); };
  ws.onclose = () => {
    el('state').textContent = 'disconnected';
    log('ws closed');
    if (!wsClosedByUser) setTimeout(connect, 1000);
  };
  ws.onerror = () => log('ws error');
  ws.onmessage = (ev) => {
    const buf = ev.data;
    if (buf.byteLength === MSG_BYTES) {
      const view = new DataView(buf);
      const seq = view.getUint32(0, true);
      const flags = view.getUint8(12);
      const arr = new Int16Array(FRAME_BYTES / 2);
      new Uint8Array(arr.buffer).set(new Uint8Array(buf, 13, FRAME_BYTES));
      node.port.postMessage({ type: 'frame', seq, flags, frames: arr }, [arr.buffer]);
    } else if (buf.byteLength === 5 && new Uint8Array(buf)[0] === 0x01) {
      const seq = new DataView(buf).getUint32(1, true);
      node.port.postMessage({ type: 'ctrl', seq });
    }
  };
}

el('start').disabled = false;
el('connect').disabled = true;
el('start').addEventListener('click', () => startAudio().catch((e) => log('start failed: ' + e.message)));
el('connect').addEventListener('click', connect);
el('profile').addEventListener('change', () => {
  FILL_FLOOR_MS = Number(el('profile').value);
  if (node) node.port.postMessage({ type: 'setFloor', fillFloorMs: FILL_FLOOR_MS });
  recomputeGeometry();
  syncProfileControl();
  log('latency profile -> floor ' + FILL_FLOOR_MS + ' ms (lower = tighter, more underrun risk)');
});
recomputeGeometry();
loadProfile();
</script>
</body>
</html>
